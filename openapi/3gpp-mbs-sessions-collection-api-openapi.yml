openapi: 3.2.0
info:
  title: 3gpp-mbs-session MBS Sessions collection API
  version: 1.3.0
  description: "API for MBS Session Management.  \n© 2025, 3GPP Organizational Partners (ARIB, ATIS, CCSA, ETSI, TSDSI, TTA, TTC).  \nAll rights reserved.\n"
servers:
- url: '{apiRoot}/3gpp-mbs-session/v1'
  variables:
    apiRoot:
      default: https://example.com
      description: apiRoot as defined in clause 5.2.4 of 3GPP TS 29.122
security:
- {}
- oAuth2ClientCredentials: []
tags:
- name: MBS Sessions collection
paths:
  /mbs-sessions:
    post:
      summary: Request the creation of a new MBS Session.
      tags:
      - MBS Sessions collection
      operationId: CreateMBSSession
      requestBody:
        description: Representation of the new MBS session to be created at the NEF.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MbsSessionCreateReq'
      responses:
        '201':
          description: 'Created. Successful creation of a new Individual MBS session resource.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MbsSessionCreateRsp'
          headers:
            Location:
              description: 'Contains the URI of the newly created resource, according to the structure {apiRoot}/3gpp-mbs-session/v1/mbs-sessions/{mbsSessionRef}

                '
              required: true
              schema:
                type: string
        '400':
          $ref: TS29122_CommonData.yaml#/components/responses/400
        '401':
          $ref: TS29122_CommonData.yaml#/components/responses/401
        '403':
          description: 'The request is rejected by the NEF and more details (along with ProblemDetails) may be returned.

            '
          content:
            application/problem+json:
              schema:
                $ref: TS29522_MBSTMGI.yaml#/components/schemas/ProblemDetailsTmgiAlloc
        '404':
          $ref: TS29122_CommonData.yaml#/components/responses/404
        '411':
          $ref: TS29122_CommonData.yaml#/components/responses/411
        '413':
          $ref: TS29122_CommonData.yaml#/components/responses/413
        '415':
          $ref: TS29122_CommonData.yaml#/components/responses/415
        '429':
          $ref: TS29122_CommonData.yaml#/components/responses/429
        '500':
          $ref: TS29122_CommonData.yaml#/components/responses/500
        '503':
          $ref: TS29122_CommonData.yaml#/components/responses/503
        default:
          $ref: TS29122_CommonData.yaml#/components/responses/default
components:
  schemas:
    MbsSessionCreateReq:
      description: Represents the parameters to request MBS Session creation.
      type: object
      properties:
        afId:
          type: string
        mbsSession:
          $ref: TS29571_CommonData.yaml#/components/schemas/MbsSession
        suppFeat:
          $ref: TS29571_CommonData.yaml#/components/schemas/SupportedFeatures
      required:
      - afId
      - mbsSession
    MbsSessionCreateRsp:
      description: Represents the parameters to be returned in an MBS Session creation response..
      type: object
      properties:
        mbsSession:
          $ref: TS29571_CommonData.yaml#/components/schemas/MbsSession
        eventList:
          $ref: TS29571_CommonData.yaml#/components/schemas/MbsSessionEventReportList
        suppFeat:
          $ref: TS29571_CommonData.yaml#/components/schemas/SupportedFeatures
      required:
      - mbsSession
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: '{tokenUrl}'
          scopes: {}
externalDocs:
  description: '3GPP TS 29.522 V19.5.0; 5G System; Network Exposure Function Northbound APIs.

    '
  url: https://www.3gpp.org/ftp/Specs/archive/29_series/29.522/
