openapi: 3.2.0
info:
  title: 3gpp-mbs-ud-ingest MBS User Data Ingest Sessions (Collection) API
  version: 1.2.1
  description: "API for MBS User Data Ingest Session.  \n© 2026, 3GPP Organizational Partners (ARIB, ATIS, CCSA, ETSI, TSDSI, TTA, TTC).  \nAll rights reserved.\n"
servers:
- url: '{apiRoot}/3gpp-mbs-ud-ingest/v1'
  variables:
    apiRoot:
      default: https://example.com
      description: apiRoot as defined in clause 5.2.4 of 3GPP TS 29.122
security:
- {}
- oAuth2ClientCredentials: []
tags:
- name: MBS User Data Ingest Sessions (Collection)
paths:
  /sessions:
    get:
      summary: Retrieve all the active MBS User Data Ingest Sessions managed by the NEF.
      tags:
      - MBS User Data Ingest Sessions (Collection)
      operationId: RetrieveMBSUserDataIngestSessions
      responses:
        '200':
          description: 'OK. All the active MBS User Data Ingest Sessions managed by the NEF are returned.

            '
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: TS29580_Nmbsf_MBSUserDataIngestSession.yaml#/components/schemas/MBSUserDataIngSession
                minItems: 0
        '307':
          $ref: TS29122_CommonData.yaml#/components/responses/307
        '308':
          $ref: TS29122_CommonData.yaml#/components/responses/308
        '400':
          $ref: TS29122_CommonData.yaml#/components/responses/400
        '401':
          $ref: TS29122_CommonData.yaml#/components/responses/401
        '403':
          $ref: TS29122_CommonData.yaml#/components/responses/403
        '404':
          $ref: TS29122_CommonData.yaml#/components/responses/404
        '406':
          $ref: TS29122_CommonData.yaml#/components/responses/406
        '429':
          $ref: TS29122_CommonData.yaml#/components/responses/429
        '500':
          $ref: TS29122_CommonData.yaml#/components/responses/500
        '503':
          $ref: TS29122_CommonData.yaml#/components/responses/503
        default:
          $ref: TS29122_CommonData.yaml#/components/responses/default
    post:
      summary: Request the creation of a new Individual MBS User Data Ingest Session resource.
      tags:
      - MBS User Data Ingest Sessions (Collection)
      operationId: CreateMBSUserDataIngestSession
      requestBody:
        description: 'Contains the parameters to request the creation of a new MBS User Data Ingest Session  at the NEF.

          '
        required: true
        content:
          application/json:
            schema:
              $ref: TS29580_Nmbsf_MBSUserDataIngestSession.yaml#/components/schemas/MBSUserDataIngSession
      responses:
        '201':
          description: 'Created. A new MBS User Data Ingest Session is successfully created and a representation  of the created Individual MBS User Data Ingest Session resource is returned.

            '
          content:
            application/json:
              schema:
                $ref: TS29580_Nmbsf_MBSUserDataIngestSession.yaml#/components/schemas/MBSUserDataIngSession
          headers:
            Location:
              description: 'Contains the URI of the newly created resource, according to the structure {apiRoot}/3gpp-mbs-ud-ingest/v1/sessions/{sessionId}

                '
              required: true
              schema:
                type: string
        '400':
          description: 'The request is rejected by the NEF and more details (along with ProblemDetails) may be returned.

            '
          content:
            application/problem+json:
              schema:
                $ref: TS29580_Nmbsf_MBSUserDataIngestSession.yaml#/components/schemas/ProblemDetailsMBS
        '401':
          $ref: TS29122_CommonData.yaml#/components/responses/401
        '403':
          description: 'The request is rejected by the NEF and more details (along with ProblemDetails) may be returned.

            '
          content:
            application/problem+json:
              schema:
                $ref: TS29580_Nmbsf_MBSUserDataIngestSession.yaml#/components/schemas/ProblemDetailsMBS
        '404':
          description: 'The request is rejected by the NEF and more details (along with ProblemDetails) may be returned.

            '
          content:
            application/problem+json:
              schema:
                $ref: TS29580_Nmbsf_MBSUserDataIngestSession.yaml#/components/schemas/ProblemDetailsMBS
        '411':
          $ref: TS29122_CommonData.yaml#/components/responses/411
        '413':
          $ref: TS29122_CommonData.yaml#/components/responses/413
        '415':
          $ref: TS29122_CommonData.yaml#/components/responses/415
        '429':
          $ref: TS29122_CommonData.yaml#/components/responses/429
        '500':
          $ref: TS29122_CommonData.yaml#/components/responses/500
        '503':
          $ref: TS29122_CommonData.yaml#/components/responses/503
        default:
          $ref: TS29122_CommonData.yaml#/components/responses/default
components:
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: '{tokenUrl}'
          scopes: {}
externalDocs:
  description: '3GPP TS 29.522 V19.6.0; 5G System; Network Exposure Function Northbound APIs.

    '
  url: https://www.3gpp.org/ftp/Specs/archive/29_series/29.522/
