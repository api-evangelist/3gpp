      operationId: UpdateIndCagInfoParamProvisioning
      tags:
      - Individual CAG Information Parameters Provisioning (Document)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CagInfoPpData'
      responses:
        '200':
          description: 'OK. The Individual CAG Information Parameters Provisioning resource is successfully updated and a representation of the updated resource is returned in the response body.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CagInfoPpData'
        '204':
          description: 'No Content. The Individual CAG Information Parameters Provisioning resource is successfully updated and no content is returned in the response body.

