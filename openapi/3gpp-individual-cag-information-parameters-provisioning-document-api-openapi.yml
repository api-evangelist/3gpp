tags:
- name: Individual CAG Information Parameters Provisioning (Document)
paths:
  /pp/{ppId}:
    parameters:
    - name: ppId
      in: path
      description: 'Represents the identifier of the Individual CAG Information Parameters Provisioning resource.

        '
      required: true
      schema:
        type: string
    get:
      summary: Retrieve an existing Individual CAG Information Parameters Provisioning resource.
      operationId: GetIndCagInfoParamProvisioning
      tags:
      - Individual CAG Information Parameters Provisioning (Document)
      responses:
        '200':
          description: 'OK. The requested Individual CAG Information Parameters Provisioning resource is successfully returned in the response body.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CagInfoPpData'
        '307':
          $ref: TS29122_CommonData.yaml#/components/responses/307
