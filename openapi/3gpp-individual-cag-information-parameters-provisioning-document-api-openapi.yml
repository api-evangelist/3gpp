components:
  schemas:
    CagInfoPpData:
      description: Represents the CAG Information Parameters Provisioning.
      type: object
      properties:
        afId:
          type: string
        cagInfos:
          type: array
          items:
            $ref: '#/components/schemas/CagInformation'
          minItems: 1
        suppFeat:
          $ref: TS29571_CommonData.yaml#/components/schemas/SupportedFeatures
      required:
      - afId
    CagInformation:
      description: Represents the CAG information.
      type: object
      properties:
        ueList:
          type: array
          items:
            $ref: TS29571_CommonData.yaml#/components/schemas/Gpsi
          minItems: 1
        cagProvInfo:
          $ref: TS29571_CommonData.yaml#/components/schemas/CagProvisionInformation
      required:
      - ueList
      - cagProvInfo
    CagInfoPpDataPatch:
      description: 'Represents the requested modifications to a CAG Information Parameters Provisioning.

        '
      type: object
      properties:
        cagInfos:
          type: array
          items:
            $ref: '#/components/schemas/CagInformation'
          minItems: 1
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: '{tokenUrl}'
          scopes: {}
externalDocs:
