      default: https://example.com
      description: apiRoot as defined in clause 5.2.4 of 3GPP TS 29.122.
security:
- {}
- oAuth2ClientCredentials: []
tags:
- name: Individual RSLPPI Parameters Provisioning (Document)
paths:
  /pp/{ppId}:
    parameters:
    - name: ppId
      in: path
      description: 'Represents the identifier of the Individual RSLPPI Parameters Provisioning resource.

        '
      required: true
      schema:
        type: string
    get:
      summary: Request to retrieve an existing Individual RSLPPI Parameters Provisioning resource.
      operationId: GetIndRslppiParamsProvisioning
      tags:
      - Individual RSLPPI Parameters Provisioning (Document)
      responses:
        '200':
          description: 'OK. Successful retrieval of the requested Individual RSLPPI Parameters Provisioning. resource.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RslppiPpData'
        '307':
          $ref: TS29122_CommonData.yaml#/components/responses/307
