openapi: 3.2.0
info:
  title: 3gpp-service-parameter Individual Service Parameter Subscription API
  version: 1.3.1
  description: "API for AF service paramter  \n© 2026, 3GPP Organizational Partners (ARIB, ATIS, CCSA, ETSI, TSDSI, TTA, TTC).  \nAll rights reserved.\n"
servers:
- url: '{apiRoot}/3gpp-service-parameter/v1'
  variables:
    apiRoot:
      default: https://example.com
      description: apiRoot as defined in clause 5.2.4 of 3GPP TS 29.122.
security:
- {}
- oAuth2ClientCredentials: []
tags:
- name: Individual Service Parameter Subscription
paths:
  /{afId}/subscriptions/{subscriptionId}:
    parameters:
    - name: afId
      in: path
      description: Identifier of the AF
      required: true
      schema:
        type: string
    - name: subscriptionId
      in: path
      description: Identifier of the subscription resource
      required: true
      schema:
        type: string
    get:
      summary: read an active subscriptions for the SCS/AS and the subscription Id
      operationId: ReadAnSubscription
      tags:
      - Individual Service Parameter Subscription
      responses:
        '200':
          description: OK (Successful get the active subscription)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceParameterData'
        '307':
          $ref: TS29122_CommonData.yaml#/components/responses/307
        '308':
          $ref: TS29122_CommonData.yaml#/components/responses/308
        '400':
          $ref: TS29122_CommonData.yaml#/components/responses/400
        '401':
          $ref: TS29122_CommonData.yaml#/components/responses/401
        '403':
          $ref: TS29122_CommonData.yaml#/components/responses/403
        '404':
          $ref: TS29122_CommonData.yaml#/components/responses/404
        '406':
          $ref: TS29122_CommonData.yaml#/components/responses/406
        '429':
          $ref: TS29122_CommonData.yaml#/components/responses/429
        '500':
          $ref: TS29122_CommonData.yaml#/components/responses/500
        '503':
          $ref: TS29122_CommonData.yaml#/components/responses/503
        default:
          $ref: TS29122_CommonData.yaml#/components/responses/default
    put:
      summary: Fully updates/replaces an existing subscription resource
      operationId: FullyUpdateAnSubscription
      tags:
      - Individual Service Parameter Subscription
      requestBody:
        description: Parameters to update/replace the existing subscription
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceParameterData'
      responses:
        '200':
          description: OK (Successful update of the subscription)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceParameterData'
        '204':
          description: OK (Successful update of the subscription)
        '307':
          $ref: TS29122_CommonData.yaml#/components/responses/307
        '308':
          $ref: TS29122_CommonData.yaml#/components/responses/308
        '400':
          $ref: TS29122_CommonData.yaml#/components/responses/400
        '401':
          $ref: TS29122_CommonData.yaml#/components/responses/401
        '403':
          $ref: TS29122_CommonData.yaml#/components/responses/403
        '404':
          $ref: TS29122_CommonData.yaml#/components/responses/404
        '411':
          $ref: TS29122_CommonData.yaml#/components/responses/411
        '413':
          $ref: TS29122_CommonData.yaml#/components/responses/413
        '415':
          $ref: TS29122_CommonData.yaml#/components/responses/415
        '429':
          $ref: TS29122_CommonData.yaml#/components/responses/429
        '500':
          $ref: TS29122_CommonData.yaml#/components/responses/500
        '503':
          $ref: TS29122_CommonData.yaml#/components/responses/503
        default:
          $ref: TS29122_CommonData.yaml#/components/responses/default
    patch:
      summary: Partial updates/replaces an existing subscription resource
      operationId: PartialUpdateAnSubscription
      tags:
      - Individual Service Parameter Subscription
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ServiceParameterDataPatch'
      responses:
        '200':
          description: OK. The subscription was modified successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceParameterData'
        '204':
          description: OK. The subscription was modified successfully.
        '307':
          $ref: TS29122_CommonData.yaml#/components/responses/307
        '308':
          $ref: TS29122_CommonData.yaml#/components/responses/308
        '400':
          $ref: TS29122_CommonData.yaml#/components/responses/400
        '401':
          $ref: TS29122_CommonData.yaml#/components/responses/401
        '403':
          $ref: TS29122_CommonData.yaml#/components/responses/403
        '404':
          $ref: TS29122_CommonData.yaml#/components/responses/404
        '411':
          $ref: TS29122_CommonData.yaml#/components/responses/411
        '413':
          $ref: TS29122_CommonData.yaml#/components/responses/413
        '415':
          $ref: TS29122_CommonData.yaml#/components/responses/415
        '429':
          $ref: TS29122_CommonData.yaml#/components/responses/429
        '500':
          $ref: TS29122_CommonData.yaml#/components/responses/500
        '503':
          $ref: TS29122_CommonData.yaml#/components/responses/503
        default:
          $ref: TS29122_CommonData.yaml#/components/responses/default
    delete:
      summary: Deletes an already existing subscription
      operationId: DeleteAnSubscription
      tags:
      - Individual Service Parameter Subscription
      responses:
        '204':
          description: No Content (Successful deletion of the existing subscription)
        '307':
          $ref: TS29122_CommonData.yaml#/components/responses/307
        '308':
          $ref: TS29122_CommonData.yaml#/components/responses/308
        '400':
          $ref: TS29122_CommonData.yaml#/components/responses/400
        '401':
          $ref: TS29122_CommonData.yaml#/components/responses/401
        '403':
          $ref: TS29122_CommonData.yaml#/components/responses/403
        '404':
          $ref: TS29122_CommonData.yaml#/components/responses/404
        '429':
          $ref: TS29122_CommonData.yaml#/components/responses/429
        '500':
          $ref: TS29122_CommonData.yaml#/components/responses/500
        '503':
          $ref: TS29122_CommonData.yaml#/components/responses/503
        default:
          $ref: TS29122_CommonData.yaml#/components/responses/default
components:
  schemas:
    ParamForProSeRemUe:
      description: Represents the service parameters for 5G ProSe Remote UE.
      type: string
    ParamProSeMultiHopEndUeRm:
      description: 'This data type is defined in the same way as the ParamProSeMultiHopEndUe data type, but with the OpenAPI nullable property set to true.

        '
      type:
      - string
      - 'null'
    A2xParamsUuRm:
      description: 'Represents the same as the A2xParamsUu data type but with the nullable:true property.

        '
      type:
      - string
      - 'null'
    UrspRuleRequest:
      description: Contains parameters that can be used to guide the URSP.
      type: object
      properties:
        afReqUrspId:
          type: string
        trafficDesc:
          $ref: '#/components/schemas/TrafficDescriptorComponents'
        relatPrecedence:
          $ref: TS29571_CommonData.yaml#/components/schemas/Uinteger
        visitedNetDescs:
          type: array
          items:
            $ref: '#/components/schemas/NetworkDescription'
          minItems: 1
          description: 'Each element identifies one or more PLMN IDs where AF guidance for VPLMN-specific URSP rule applies.

            '
        routeSelParamSets:
          type: array
          items:
            $ref: '#/components/schemas/RouteSelectionParameterSet'
          minItems: 1
          description: 'Sets of parameters that may be used to guide the Route Selection Descriptors of the  URSP.

            '
    A2xParamsPc5Rm:
      description: 'Represents the same as the A2xParamsPc5 data type but with the nullable:true property.

        '
      type:
      - string
      - 'null'
    A2xParamsUu:
      description: 'Represents configuration parameters for A2X communications over Uu reference point.

        '
      type: string
    ParamForProSeRemUeRm:
      description: 'This data type is defined in the same way as the ParamForProSeRemUe data type, but with the OpenAPI nullable property set to true.

        '
      type:
      - string
      - 'null'
    TrafficDescriptorComponents:
      description: Traffic descriptor components for the requested URSP.
      type: object
      properties:
        appDescs:
          type: object
          additionalProperties:
            $ref: TS29522_5GLANParameterProvision.yaml#/components/schemas/AppDescriptor
          minProperties: 1
          description: 'Describes the operation systems and the corresponding applications for each operation systems. The key of map is osId.

            '
        flowDescs:
          type: array
          items:
            type: string
          minItems: 1
          description: 'Represents a 3-tuple with protocol, server ip and server port for UL/DL application traffic. The content of the string has the same encoding as the IPFilterRule AVP value as defined in IETF RFC 6733.

            '
        domainDescs:
          type: array
          items:
            type: string
          minItems: 1
          description: 'FQDN(s) or a regular expression which are used as a domain name matching criteria.

            '
        ethFlowDescs:
          type: array
          items:
            $ref: TS29514_Npcf_PolicyAuthorization.yaml#/components/schemas/EthFlowDescription
          minItems: 1
          description: 'Descriptor(s) for destination information of non-IP traffic in which only ethernet flow description is defined.

            '
        dnns:
          type: array
          items:
            $ref: TS29571_CommonData.yaml#/components/schemas/Dnn
          minItems: 1
          description: This is matched against the DNN information provided by the application.
        connCaps:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionCapabilities'
          minItems: 1
          description: 'This is matched against the information provided by a UE application when it requests a network connection with certain capabilities.

            '
        opSpecConnCaps:
          type: array
          items:
            $ref: TS29571_CommonData.yaml#/components/schemas/Bytes
          minItems: 1
          maxItems: 128
          description: 'Operator specific connection capabilities.

            '
        pinId:
          type: string
          description: This is matched against a PIN ID for a specific PIN configured in the PEGC.
        connGroupId:
          type: string
          description: 'This is matched against a Connectivity Group ID for a specific Connectivity Group configured in 5G-RG.

            '
      oneOf:
      - required:
        - pinId
      - anyOf:
        - required:
          - appDescs
        - required:
          - flowDescs
        - required:
          - domainDescs
        - required:
          - ethFlowDescs
        - required:
          - dnns
        - required:
          - connCaps
        - required:
          - opSpecConnCaps
    ParamForRangingSlPos:
      description: Represents the service parameters for ranging and sidelink positioning.
      type: string
    ParamForProSeDd:
      description: Represents the service parameters for 5G ProSe direct discovery.
      type: string
    ParamProSeMultiHopRemUe:
      description: 'Represents the service parameters for 5G ProSe Remote UE supporting 5G ProSe Layer-2 and/or Layer-3 multi-hop UE-to-Network Relay.

        '
      type: string
    ParamForRangingSlPosRm:
      description: 'This data type is defined in the same way as the ParamForRangingslpos data type, but with the OpenAPI nullable property set to true.

        '
      type:
      - string
      - 'null'
    ParamProSeMultiHopU2NRelUe:
      description: 'Represents the service parameters for 5G ProSe UE-to-Network Relay UE supporting 5G ProSe Layer-2 and/or Layer-3 multi-hop UE-to-Network Relay.

        '
      type: string
    ServiceParameterDataPatch:
      description: 'Represents the parameters to request the modification of a service parameter subscription resource.

        '
      type: object
      properties:
        paramOverPc5:
          $ref: '#/components/schemas/ParameterOverPc5Rm'
        paramOverUu:
          $ref: '#/components/schemas/ParameterOverUuRm'
        paramForProSeDd:
          $ref: '#/components/schemas/ParamForProSeDdRm'
        paramForProSeDc:
          $ref: '#/components/schemas/ParamForProSeDcRm'
        paramForProSeU2NRelUe:
          $ref: '#/components/schemas/ParamForProSeU2NRelUeRm'
        paramForProSeRemUe:
          $ref: '#/components/schemas/ParamForProSeRemUeRm'
        paramForProSeU2URelUe:
          $ref: '#/components/schemas/ParamForProSeU2URelUeRm'
        paramForProSeEndUe:
          $ref: '#/components/schemas/ParamForProSeEndUeRm'
        multiHopU2NRelUe:
          $ref: '#/components/schemas/ParamProSeMultiHopU2NRelUeRm'
        multiHopU2NRemUe:
          $ref: '#/components/schemas/ParamProSeMultiHopRemUeRm'
        multiHopU2NIntermUe:
          $ref: '#/components/schemas/ParamProSeMultiHopIntermUeRm'
        multiHopU2URelUe:
          $ref: '#/components/schemas/ParamProSeMultiHopU2URelUeRm'
        multiHopU2UEndUe:
          $ref: '#/components/schemas/ParamProSeMultiHopEndUeRm'
        paramForRangingSlPos:
          $ref: '#/components/schemas/ParamForRangingSlPosRm'
        urspGuidance:
          type: array
          items:
            $ref: '#/components/schemas/UrspRuleRequest'
          minItems: 1
          description: Contains the service parameter used to guide the URSP.
        vpsUrspGuidance:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UrspRuleRequest'
          minItems: 1
          description: 'Contains the service parameters used to guide the VPLMN-specific URSP rule(s).

            '
        a2xParamsPc5:
          $ref: '#/components/schemas/A2xParamsPc5Rm'
        a2xParamsUu:
          $ref: '#/components/schemas/A2xParamsUuRm'
        tnaps:
          type:
          - array
          - 'null'
          items:
            $ref: TS29571_CommonData.yaml#/components/schemas/TnapId
          minItems: 1
          description: Contains the TNAP IDs collocated with the 5G-RG(s) of a specific user.
        subNotifEvents:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Event'
          minItems: 1
          description: 'Identifies the AF subscribed event(s) notifications related to AF provisioned service parameters.

            '
        notificationDestination:
          $ref: TS29122_CommonData.yaml#/components/schemas/Uri
        non3gppDevInfos:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Non3gppDeviceInformation'
          minItems: 1
    ParameterOverPc5Rm:
      description: 'Represents the same as the ParameterOverPc5 data type but with the nullable:true property.

        '
      type:
      - string
      - 'null'
    A2xParamsPc5:
      description: 'Represents configuration parameters for A2X communications over PC5 reference point.

        '
      type: string
    ParameterOverPc5:
      description: 'Represents configuration parameters for V2X communications over PC5 reference point.

        '
      type: string
    ParameterOverUu:
      description: 'Represents configuration parameters for V2X communications over Uu reference point.

        '
      type: string
    ParamProSeMultiHopU2URelUe:
      description: 'Represents the service parameters for 5G ProSe Layer-3 UE-to-UE Relay UE supporting 5G ProSe Layer-3 multi-hop UE-to-UE Relay.

        '
      type: string
    ParamProSeMultiHopIntermUeRm:
      description: 'This data type is defined in the same way as the ParamProSeMultiHopIntermUe data type, but with the OpenAPI nullable property set to true.

        '
      type:
      - string
      - 'null'
    NetworkDescription:
      description: 'Represents the description of a PLMN, by the definition of the PLMN ID, the MCC (and applicable MNC(s)) or the indication of any PLMN.

        '
      type: object
      properties:
        plmnId:
          $ref: TS29571_CommonData.yaml#/components/schemas/PlmnId
        mcc:
          $ref: TS29571_CommonData.yaml#/components/schemas/Mcc
        mncs:
          type: array
          items:
            $ref: TS29571_CommonData.yaml#/components/schemas/Mnc
          minItems: 1
          description: Represents the applicable MNC(s) for the indicated MCC.
        anyPlmnInd:
          type: boolean
          description: Indicates any PLMN.
      oneOf:
      - required:
        - plmnId
      - required:
        - mcc
      - required:
        - anyPlmnInd
    ParamForProSeU2URelUeRm:
      description: 'This data type is defined in the same way as the ParamForProSeU2URelay data type, but with the OpenAPI nullable property set to true.

        '
      type:
      - string
      - 'null'
    ConnectionCapabilities:
      anyOf:
      - type: string
        enum:
        - IMS
        - MMS
        - SUPL
        - INTERNET
        - IOT_DELAY_TOLERANT
        - IOT_NON_DELAY_TOLERANT
        - DL_STREAMING
        - UL_STREAMING
        - VEHIC_COMM
        - REAL_TIME_INTERACTIVE
        - UNIFIED_COMM
        - BACKGROUND
        - MISS_CRITICAL
        - TIME_CRITICAL
        - LOW_LAT_LOSS_TOL_UNACK
      - type: string
        description: 'This string provides forward-compatibility with future extensions to the enumeration and is not used to encode content defined in the present version of this API.

          '
      description: "Represents the information provided by a UE application when it requests a network\nconnection with certain capabilities.  \nPossible values are:\n  - IMS: Indicates the connection capability to support IMS service.\n  - MMS: Indicates the connection capability to support MMS service.\n  - SUPL: Indicates the connection capability to support SUPL service.\n  - INTERNET: Indicates the connection capability to support Internet service.\n  - IOT_DELAY_TOLERANT: Indicates the connection capability to support IoT\n    delay-tolerant services.\n  - IOT_NON_DELAY_TOLERANT: Indicates the connection capability to support IoT\n    non-delay-tolerant services.\n  - DL_STREAMING: Indicates the connection capability to support downlink streaming\n    services.\n  - UL_STREAMING: Indicates the connection capability to support uplink streaming services\n  - VEHIC_COMM: Indicates the connection capability to support vehicular communication\n    services.\n  - REAL_TIME_INTERACTIVE: Indicates the connection capability to support real time\n    interactive services.\n  - UNIFIED_COMM: Indicates the connection capability to support unified communication\n    services.\n  - BACKGROUND: Indicates the connection capability to support background services.\n  - MISS_CRITICAL: Indicates the connection capability to support mission critical services.\n  - TIME_CRITICAL: Indicates the connection capability to support time critical services.\n  - LOW_LAT_LOSS_TOL_UNACK: Indicates the connection capability to support low latency\n    loss tolerant communications in un-acknowledged mode.\n"
    ParameterOverUuRm:
      description: 'Represents the same as the ParameterOverUu data type but with the nullable:true property.

        '
      type:
      - string
      - 'null'
    ParamForProSeU2NRelUeRm:
      description: 'This data type is defined in the same way as the ParamForProSeU2NRelay data type, but with the OpenAPI nullable property set to true.

        '
      type:
      - string
      - 'null'
    ParamProSeMultiHopRemUeRm:
      description: 'This data type is defined in the same way as the ParamProSeMultiHopRemUe data type, but with the OpenAPI nullable property set to true.

        '
      type:
      - string
      - 'null'
    ParamForProSeU2NRelUe:
      description: Represents the service parameters for 5G ProSe UE-to-network relay UE.
      type: string
    ServiceParameterData:
      description: Represents an individual Service Parameter subscription resource.
      type: object
      properties:
        afServiceId:
          type: string
          description: Identifies a service on behalf of which the AF is issuing the request.
        appId:
          type: string
          description: Identifies an application.
        dnn:
          $ref: TS29571_CommonData.yaml#/components/schemas/Dnn
        snssai:
          $ref: TS29571_CommonData.yaml#/components/schemas/Snssai
        externalGroupId:
          $ref: TS29122_CommonData.yaml#/components/schemas/ExternalGroupId
        anyUeInd:
          type: boolean
          description: 'Identifies whether the AF request applies to any non-roaming UE. This attribute, when provided, shall set to "true" if applicable for any UE, otherwise, set to "false".

            '
        roamUeNetDescs:
          type: array
          items:
            $ref: '#/components/schemas/NetworkDescription'
          minItems: 1
          description: Each element identifies one or more PLMN IDs of inbound roamers.
        gpsi:
          $ref: TS29571_CommonData.yaml#/components/schemas/Gpsi
        ueIpv4:
          $ref: TS29571_CommonData.yaml#/components/schemas/Ipv4Addr
        ueIpv6:
          $ref: TS29571_CommonData.yaml#/components/schemas/Ipv6Addr
        ueMac:
          $ref: TS29571_CommonData.yaml#/components/schemas/MacAddr48
        self:
          $ref: TS29122_CommonData.yaml#/components/schemas/Link
        subNotifEvents:
          type: array
          items:
            $ref: '#/components/schemas/Event'
          minItems: 1
          description: 'Identifies the AF subscribed event(s) notifications related to AF provisioned service parameters.

            '
        notificationDestination:
          $ref: TS29122_CommonData.yaml#/components/schemas/Uri
        requestTestNotification:
          type: boolean
          description: 'Set to true by the AF to request the NEF to send a test notification as defined in clause 5.2.5.3 of 3GPP TS 29.122. Set to false or omitted otherwise.

            '
        websockNotifConfig:
          $ref: TS29122_CommonData.yaml#/components/schemas/WebsockNotifConfig
        paramOverPc5:
          $ref: '#/components/schemas/ParameterOverPc5'
        paramOverUu:
          $ref: '#/components/schemas/ParameterOverUu'
        paramForProSeDd:
          $ref: '#/components/schemas/ParamForProSeDd'
        paramForProSeDc:
          $ref: '#/components/schemas/ParamForProSeDc'
        paramForProSeU2NRelUe:
          $ref: '#/components/schemas/ParamForProSeU2NRelUe'
        paramForProSeRemUe:
          $ref: '#/components/schemas/ParamForProSeRemUe'
        paramForProSeU2URelUe:
          $ref: '#/components/schemas/ParamForProSeU2URelUe'
        paramForProSeEndUe:
          $ref: '#/components/schemas/ParamForProSeEndUe'
        multiHopU2NRelUe:
          $ref: '#/components/schemas/ParamProSeMultiHopU2NRelUe'
        multiHopU2NRemUe:
          $ref: '#/components/schemas/ParamProSeMultiHopRemUe'
        multiHopU2NIntermUe:
          $ref: '#/components/schemas/ParamProSeMultiHopIntermUe'
        multiHopU2URelUe:
          $ref: '#/components/schemas/ParamProSeMultiHopU2URelUe'
        multiHopU2UEndUe:
          $ref: '#/components/schemas/ParamProSeMultiHopEndUe'
        paramForRangingSlPos:
          $ref: '#/components/schemas/ParamForRangingSlPos'
        urspGuidance:
          type: array
          items:
            $ref: '#/components/schemas/UrspRuleRequest'
          minItems: 1
          description: Contains the service parameter used to guide the URSP.
        vpsUrspGuidance:
          type: array
          items:
            $ref: '#/components/schemas/UrspRuleRequest'
          minItems: 1
          description: 'Contains the service parameters used to guide the VPLMN-specific URSP rule(s).

            '
        a2xParamsPc5:
          $ref: '#/components/schemas/A2xParamsPc5'
        a2xParamsUu:
          $ref: '#/components/schemas/A2xParamsUu'
        tnaps:
          type: array
          items:
            $ref: TS29571_CommonData.yaml#/components/schemas/TnapId
          minItems: 1
          description: Contains the TNAP IDs collocated with the 5G-RG(s) of a specific user.
        mtcProviderId:
          $ref: TS29571_CommonData.yaml#/components/schemas/MtcProviderInformation
        non3gppDevInfos:
          type: array
          items:
            $ref: '#/components/schemas/Non3gppDeviceInformation'
          minItems: 1
        suppFeat:
          $ref: TS29571_CommonData.yaml#/components/schemas/SupportedFeatures
    Event:
      anyOf:
      - type: string
        enum:
        - SUCCESS_UE_POL_DEL_SP
        - UNSUCCESS_UE_POL_DEL_SP
        - PARTLY_UNSUCC_UE_POL_DEL_SP
        - UNSUCCESS_PCF_SERVICE_AUTHORIZATION
      - type: string
        description: 'This string provides forward-compatibility with future extensions to the enumeration and is not used to encode content defined in the present version of this API.

          '
      description: "Represents the AF subscribe to event notification of the outcome related to the\ninvocation of AF provisioned service parameters.  \nPossible values are:\n- SUCCESS_UE_POL_DEL_SP: Successful UE Policy Delivery related to \n  the invocation of AF provisioned Service Parameters.\n- UNSUCCESS_UE_POL_DEL_SP: Unsuccessful UE Policy Delivery related to the invocation of AF\n   provisioned Service Parameters.\n- PARTLY_UNSUCC_UE_POL_DEL_SP: Partially unsuccessful UE Policy Delivery related to the\n  invocation of AF provisioned Service Parameters.\n- UNSUCCESS_PCF SERVICE AUTHORIZATION: Unsuccessful authorization in the PCF related to the\n  invocation of AF provisioned Service Parameters.\n"
    ParamProSeMultiHopIntermUe:
      description: 'Represents the service parameters for 5G ProSe Intermediate UE-to-Network Relay supporting 5G ProSe Layer-2 and/or Layer-3 multi-hop UE-to-Network Relay.

        '
      type: string
    ParamForProSeEndUe:
