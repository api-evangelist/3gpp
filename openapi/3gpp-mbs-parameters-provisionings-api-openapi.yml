openapi: 3.2.0
info:
  title: 3gpp-mbs-session MBS Parameters Provisionings API
  version: 1.3.0
  description: "API for MBS Session Management.  \n© 2025, 3GPP Organizational Partners (ARIB, ATIS, CCSA, ETSI, TSDSI, TTA, TTC).  \nAll rights reserved.\n"
servers:
- url: '{apiRoot}/3gpp-mbs-session/v1'
  variables:
    apiRoot:
      default: https://example.com
      description: apiRoot as defined in clause 5.2.4 of 3GPP TS 29.122
security:
- {}
- oAuth2ClientCredentials: []
tags:
- name: MBS Parameters Provisionings
paths:
  /mbs-pp:
    get:
      summary: Request to retrieve all the active MBS Parameters Provisioning resources at the NEF.
      operationId: GetMBSParamsProvisionings
      tags:
      - MBS Parameters Provisionings
      responses:
        '200':
          description: 'OK. All the active MBS Parameters Provisioning resources managed by the NEF are returned.

            '
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MbsPpData'
                minItems: 1
        '307':
          $ref: TS29122_CommonData.yaml#/components/responses/307
        '308':
          $ref: TS29122_CommonData.yaml#/components/responses/308
        '400':
          $ref: TS29122_CommonData.yaml#/components/responses/400
        '401':
          $ref: TS29122_CommonData.yaml#/components/responses/401
        '403':
          $ref: TS29122_CommonData.yaml#/components/responses/403
        '404':
          $ref: TS29122_CommonData.yaml#/components/responses/404
        '406':
          $ref: TS29122_CommonData.yaml#/components/responses/406
        '429':
          $ref: TS29122_CommonData.yaml#/components/responses/429
        '500':
          $ref: TS29122_CommonData.yaml#/components/responses/500
        '503':
          $ref: TS29122_CommonData.yaml#/components/responses/503
        default:
          $ref: TS29122_CommonData.yaml#/components/responses/default
components:
  schemas:
    MbsSessAuthData:
      description: Represents the MBS Session Authorization data.
      type: object
      properties:
        extGroupId:
          $ref: TS29122_CommonData.yaml#/components/schemas/ExternalGroupId
        gpsisList:
          type: object
          additionalProperties:
            $ref: TS29571_CommonData.yaml#/components/schemas/Gpsi
          minProperties: 1
          description: 'Represents the list of the GPSI(s) of the member UE(s) constituting the multicast MBS group. Any value of type can be used as a key of the map.

            '
        mbsSessionIdList:
          $ref: TS29503_Nudm_PP.yaml#/components/schemas/5MbsAuthorizationInfo
      required:
      - extGroupId
      - mbsSessionIdList
    MbsPpData:
      description: Represents MBS Parameters Provisioning data.
      type: object
      properties:
        afId:
          type: string
        mtcProviderId:
          $ref: TS29571_CommonData.yaml#/components/schemas/MtcProviderInformation
        mbsSessAuthData:
          $ref: '#/components/schemas/MbsSessAuthData'
        mbsSessAssistInfo:
          $ref: '#/components/schemas/MbsSessAssistInfo'
        suppFeat:
          $ref: TS29571_CommonData.yaml#/components/schemas/SupportedFeatures
      required:
      - afId
    MbsSessAssistInfo:
      description: 'Represents the MBS Session Assistance information data set(s).

        '
      type: object
      properties:
        mbsSessAssistData:
          type: array
          items:
            $ref: TS29503_Nudm_PP.yaml#/components/schemas/MbsAssistanceInfo
          minItems: 1
      required:
      - mbsSessAssistData
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: '{tokenUrl}'
          scopes: {}
externalDocs:
  description: '3GPP TS 29.522 V19.5.0; 5G System; Network Exposure Function Northbound APIs.

    '
  url: https://www.3gpp.org/ftp/Specs/archive/29_series/29.522/
