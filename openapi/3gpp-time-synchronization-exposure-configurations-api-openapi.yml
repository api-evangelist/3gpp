openapi: 3.2.0
info:
  title: 3gpp-time-sync Time Synchronization Exposure Configurations API
  version: 1.2.0
  description: "API for time synchronization exposure.  \n© 2025, 3GPP Organizational Partners (ARIB, ATIS, CCSA, ETSI, TSDSI, TTA, TTC).  \nAll rights reserved.\n"
servers:
- url: '{apiRoot}/3gpp-time-sync/v1'
  variables:
    apiRoot:
      default: https://example.com
      description: apiRoot as defined in clause 5.2.4 of 3GPP TS 29.122.
security:
- {}
- oAuth2ClientCredentials: []
tags:
- name: Time Synchronization Exposure Configurations
paths:
  /{afId}/subscriptions/{subscriptionId}/configurations:
    get:
      summary: read all of the active configurations for the AF
      operationId: ReadAllConfirguations
      tags:
      - Time Synchronization Exposure Configurations
      parameters:
      - name: afId
        in: path
        description: Identifier of the AF
        required: true
        schema:
          type: string
      - name: subscriptionId
        description: 'String identifying the individual synchronization Exposure Subscription resource in the NEF

          '
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK (Successful get all of the active configurations for the AF)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeSyncExposureConfig'
                minItems: 0
        '307':
          $ref: TS29122_CommonData.yaml#/components/responses/307
        '308':
          $ref: TS29122_CommonData.yaml#/components/responses/308
        '400':
          $ref: TS29122_CommonData.yaml#/components/responses/400
        '401':
          $ref: TS29122_CommonData.yaml#/components/responses/401
        '403':
          $ref: TS29122_CommonData.yaml#/components/responses/403
        '404':
          $ref: TS29122_CommonData.yaml#/components/responses/404
        '406':
          $ref: TS29122_CommonData.yaml#/components/responses/406
        '429':
          $ref: TS29122_CommonData.yaml#/components/responses/429
        '500':
          $ref: TS29122_CommonData.yaml#/components/responses/500
        '503':
          $ref: TS29122_CommonData.yaml#/components/responses/503
        default:
          $ref: TS29122_CommonData.yaml#/components/responses/default
    post:
      summary: Creates a new configuration resource
      operationId: CreateNewConfirguation
      tags:
      - Time Synchronization Exposure Configurations
      parameters:
      - name: afId
        in: path
        description: Identifier of the AF
        required: true
        schema:
          type: string
      - name: subscriptionId
        description: 'String identifying the individual synchronization Exposure Subscription resource in the NEF.

          '
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: new configuration creation
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeSyncExposureConfig'
      responses:
        '201':
          description: Created (Successful creation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSyncExposureConfig'
          headers:
            Location:
              description: Contains the URI of the newly created resource
              required: true
              schema:
                type: string
        '307':
          $ref: TS29122_CommonData.yaml#/components/responses/307
        '308':
          $ref: TS29122_CommonData.yaml#/components/responses/308
        '400':
          $ref: TS29122_CommonData.yaml#/components/responses/400
        '401':
          $ref: TS29122_CommonData.yaml#/components/responses/401
        '403':
          $ref: TS29122_CommonData.yaml#/components/responses/403
        '404':
          $ref: TS29122_CommonData.yaml#/components/responses/404
        '411':
          $ref: TS29122_CommonData.yaml#/components/responses/411
        '413':
          $ref: TS29122_CommonData.yaml#/components/responses/413
        '415':
          $ref: TS29122_CommonData.yaml#/components/responses/415
        '429':
          $ref: TS29122_CommonData.yaml#/components/responses/429
        '500':
          $ref: TS29122_CommonData.yaml#/components/responses/500
        '503':
          $ref: TS29122_CommonData.yaml#/components/responses/503
        default:
          $ref: TS29122_CommonData.yaml#/components/responses/default
      callbacks:
        timeSyncConfigNotification:
          '{$request.body#/configNotifUri}':
            post:
              requestBody:
                description: Notification for Time Synchronization Service status.
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/TimeSyncExposureConfigNotif'
              responses:
                '204':
                  description: Expected response to a successful callback processing without a body
                '307':
                  $ref: TS29122_CommonData.yaml#/components/responses/307
                '308':
                  $ref: TS29122_CommonData.yaml#/components/responses/308
                '400':
                  $ref: TS29122_CommonData.yaml#/components/responses/400
                '401':
                  $ref: TS29122_CommonData.yaml#/components/responses/401
                '403':
                  $ref: TS29122_CommonData.yaml#/components/responses/403
                '404':
                  $ref: TS29122_CommonData.yaml#/components/responses/404
                '411':
                  $ref: TS29122_CommonData.yaml#/components/responses/411
                '413':
                  $ref: TS29122_CommonData.yaml#/components/responses/413
                '415':
                  $ref: TS29122_CommonData.yaml#/components/responses/415
                '429':
                  $ref: TS29122_CommonData.yaml#/components/responses/429
                '500':
                  $ref: TS29122_CommonData.yaml#/components/responses/500
                '503':
                  $ref: TS29122_CommonData.yaml#/components/responses/503
                default:
                  $ref: TS29122_CommonData.yaml#/components/responses/default
components:
  schemas:
    TimeSyncExposureConfigNotif:
      description: Contains the notification of time synchronization service state.
      type: object
      properties:
        configNotifId:
          type: string
          description: Notification Correlation ID assigned by the AF.
        stateOfConfig:
          $ref: '#/components/schemas/StateOfConfiguration'
      required:
      - configNotifId
      - stateOfConfig
    InstanceType:
      anyOf:
      - type: string
        enum:
        - BOUNDARY_CLOCK
        - E2E_TRANS_CLOCK
        - P2P_TRANS_CLOCK
        - P2P_RELAY_INSTANCE
      - type: string
        description: 'This string provides forward-compatibility with future extensions to the enumeration and is not used to encode content defined in the present version of this API.

          '
      description: "Identifies the supported PTP instance type.  \nPossible values are:\n- BOUNDARY_CLOCK: Indicates Boundary Clock as defined in IEEE Std 1588.\n- E2E_TRANS_CLOCK: Indicates End-to-End Transparent Clock as defined in IEEE Std 1588.\n- P2P_TRANS_CLOCK: Indicates Peer-to-Peer Transparent Clock as defined in IEEE Std 1588.\n- P2P_RELAY_INSTANCE: Indicates PTP Relay instance as defined in IEEE Std 802.1AS.\n"
    StateOfDstt:
      description: Contains the PTP port state of a DS-TT.
      type: object
      properties:
        gpsi:
          $ref: TS29571_CommonData.yaml#/components/schemas/Gpsi
        state:
          type: boolean
          description: 'When the PTP port state is Leader, Follower or Passive, it is included and set to true to indicate the state of configuration for DS-TT port is active; when PTP port state is in any other case, it is included and set to false to indicate the state of  configuration for DS port is inactive.

            '
        clkQltIndOfDstt:
          $ref: '#/components/schemas/AcceptanceCriteriaResultIndication'
      required:
      - gpsi
      - state
    TimeSyncExposureConfig:
      description: Contains the Time Synchronization Configuration parameters.
      type: object
      properties:
        upNodeId:
          $ref: TS29571_CommonData.yaml#/components/schemas/Uint64
        reqPtpIns:
          $ref: '#/components/schemas/PtpInstance'
        gmEnable:
          type: boolean
          description: 'Indicates that the AF requests 5GS to act as a grandmaster for PTP or gPTP if it is included and set to true.

            '
        gmPrio:
          $ref: TS29571_CommonData.yaml#/components/schemas/Uinteger
        timeDom:
          $ref: TS29571_CommonData.yaml#/components/schemas/Uinteger
        timeSyncErrBdgt:
          $ref: TS29571_CommonData.yaml#/components/schemas/Uinteger
        configNotifId:
          type: string
          description: Notification Correlation ID assigned by the AF.
        configNotifUri:
          $ref: TS29122_CommonData.yaml#/components/schemas/Uri
        tempValidity:
          $ref: TS29514_Npcf_PolicyAuthorization.yaml#/components/schemas/TemporalValidity
        coverageArea:
          $ref: TS29571_CommonData.yaml#/components/schemas/SpatialValidityCond
        clkQltDetLvl:
          $ref: TS29571_CommonData.yaml#/components/schemas/ClockQualityDetailLevel
        clkQltAcptCri:
          $ref: TS29571_CommonData.yaml#/components/schemas/ClockQualityAcceptanceCriterion
      required:
      - upNodeId
      - reqPtpIns
      - timeDom
      - configNotifId
      - configNotifUri
    StateOfConfiguration:
      description: Contains the state of the time synchronization configuration.
      type: object
      properties:
        stateOfNwtt:
          type: boolean
          description: 'When the PTP port state is Leader, Follower or Passive, it is included and set to true to indicate the state of configuration for NW-TT port is active; when PTP port state is in any other case, it is included and set to false to indicate the state of configuration for NW-TT port is inactive. Default value is false.

            '
        clkQltIndOfNwtt:
          $ref: '#/components/schemas/AcceptanceCriteriaResultIndication'
        stateOfDstts:
          description: 'Contains the PTP port states of the DS-TT(s).

            '
          type: array
          items:
            $ref: '#/components/schemas/StateOfDstt'
          minItems: 1
    AcceptanceCriteriaResultIndication:
      anyOf:
      - type: string
        enum:
        - ACCEPTABLE
        - NON_ACCEPTABLE
      - type: string
        description: 'This string provides forward-compatibility with future extensions to the enumeration and is not used to encode content defined in the present version of this API.

          '
      description: "Identifies the supported acceptable / not acceptable indication.  \nPossible values are:\n- ACCEPTABLE: PTP port in (g)PTP service meets the clock quality acceptance criteria.\n- NON_ACCEPTABLE: PTP port in (g)PTP service does not meet the clock quality acceptance\n  criteria.\n"
    PtpInstance:
      description: Contains PTP instance configuration and activation requested by the AF.
      type: object
      properties:
        instanceType:
          $ref: '#/components/schemas/InstanceType'
        protocol:
          $ref: '#/components/schemas/Protocol'
        ptpProfile:
          type: string
          description: Identifies the PTP profile.
        portConfigs:
          type: array
          items:
            $ref: '#/components/schemas/ConfigForPort'
          minItems: 1
          description: 'Contains the configurations for the PTP port(s) in the PTP instance.

            '
      required:
      - instanceType
      - protocol
      - ptpProfile
    ConfigForPort:
      description: Contains configuration for each port.
      type: object
      properties:
        gpsi:
          $ref: TS29571_CommonData.yaml#/components/schemas/Gpsi
        n6Ind:
          type: boolean
          enum:
          - true
        ptpEnable:
          type: boolean
          description: 'This is used to set the portDS.portEnable. If omitted, the default value as described in the PTP Profile is used.

            '
        logSyncInter:
          type: integer
          description: 'Specifies the mean time interval between successive Sync messages.

            '
        logSyncInterInd:
          type: boolean
          description: 'When set to "false", the value of "logSyncInter" attribute is used to set the initialLogSyncInterval as described in IEEE Std 802.1AS [46]. When set to "true", the value of "logSyncInter" attribute is used to set the mgtSettableLogSyncInterval as described in IEEE Std 802.1AS [46].

            '
        logAnnouInter:
          type: integer
          description: 'Specifies the mean time interval between successive Announce messages.

            '
        logAnnouInterInd:
          type: boolean
          description: 'When set to "false", the value of "logAnnouInter" attribute is used to set the initialLogAnnounceInterval as described in IEEE 802.1AS [46]. When set to "true", the value of "logAnnouInter" attribute is used to set the  mgtSettableLogAnnounceInterval as described in IEEE Std 802.1AS [46].

            '
      oneOf:
      - required:
        - gpsi
      - required:
        - n6Ind
    Protocol:
      anyOf:
      - type: string
        enum:
        - ETH
        - IPV4
        - IPV6
      - type: string
        description: 'This string provides forward-compatibility with future extensions to the enumeration and is not used to encode content defined in the present version of this API.

          '
      description: "Identifies the supported protocol.  \nPossible values are:\n- ETH: Indicates Ethernet as defined in IEEE Std 1588 [45] Annex E is supported.\n- IPV4: Indicates IPv4 as defined in IEEE Std 1588 [45] Annex C is supported.\n- IPV6: Indicates IPv6 as defined in IEEE Std 1588 [45] Annex D is supported.\n"
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: '{tokenUrl}'
          scopes: {}
externalDocs:
  description: '3GPP TS 29.522 V19.5.0; 5G System; Network Exposure Function Northbound APIs.

    '
  url: https://www.3gpp.org/ftp/Specs/archive/29_series/29.522/
