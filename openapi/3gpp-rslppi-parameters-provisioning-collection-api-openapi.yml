openapi: 3.2.0
info:
  title: 3gpp-rslppi-pp RSLPPI Parameters Provisioning (Collection) API
  version: 1.0.0
  description: "API for RSLPPI Parameters Provisioning.  \n© 2024, 3GPP Organizational Partners (ARIB, ATIS, CCSA, ETSI, TSDSI, TTA, TTC).  \nAll rights reserved.\n"
servers:
- url: '{apiRoot}/3gpp-rslppi-pp/v1'
  variables:
    apiRoot:
      default: https://example.com
      description: apiRoot as defined in clause 5.2.4 of 3GPP TS 29.122.
security:
- {}
- oAuth2ClientCredentials: []
tags:
- name: RSLPPI Parameters Provisioning (Collection)
paths:
  /pp:
    post:
      summary: Request the creation of a new RSLPPI Parameters Provisioning.
      tags:
      - RSLPPI Parameters Provisioning (Collection)
      operationId: CreateRslppiParamsProvisioning
      requestBody:
        description: 'Representation of the new RSLPPI Parameters Provisioning to be created at the NEF.

          '
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RslppiPpData'
      responses:
        '201':
          description: 'Created. A representation of the created Individual RSLPPI Parameters Provisioning resource is returned in the response body.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RslppiPpData'
          headers:
            Location:
              description: 'Contains the URI of the newly created resource.

                '
              required: true
              schema:
                type: string
        '400':
          $ref: TS29122_CommonData.yaml#/components/responses/400
        '401':
          $ref: TS29122_CommonData.yaml#/components/responses/401
        '403':
          $ref: TS29122_CommonData.yaml#/components/responses/403
        '404':
          $ref: TS29122_CommonData.yaml#/components/responses/404
        '411':
          $ref: TS29122_CommonData.yaml#/components/responses/411
        '413':
          $ref: TS29122_CommonData.yaml#/components/responses/413
        '415':
          $ref: TS29122_CommonData.yaml#/components/responses/415
        '429':
          $ref: TS29122_CommonData.yaml#/components/responses/429
        '500':
          $ref: TS29122_CommonData.yaml#/components/responses/500
        '503':
          $ref: TS29122_CommonData.yaml#/components/responses/503
        default:
          $ref: TS29122_CommonData.yaml#/components/responses/default
components:
  schemas:
    RslppiPpData:
      description: Represents the RSLPPI Parameters Provisioning data.
      type: object
      properties:
        afId:
          type: string
        rslppiData:
          $ref: '#/components/schemas/RslppiData'
        suppFeat:
          $ref: TS29571_CommonData.yaml#/components/schemas/SupportedFeatures
      required:
      - afId
    RslppiData:
      description: Represents RSLPPI Parameters data.
      type: object
      properties:
        extGroupId:
          $ref: TS29122_CommonData.yaml#/components/schemas/ExternalGroupId
        gpsi:
          $ref: TS29571_CommonData.yaml#/components/schemas/Gpsi
        rslppi:
          $ref: TS29503_Nudm_SDM.yaml#/components/schemas/Rslppi
      required:
      - rslppi
      oneOf:
      - required:
        - extGroupId
      - required:
        - gpsi
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: '{tokenUrl}'
          scopes: {}
externalDocs:
  description: '3GPP TS 29.522 V18.6.0; 5G System; Network Exposure Function Northbound APIs.

    '
  url: https://www.3gpp.org/ftp/Specs/archive/29_series/29.522/
