method: searched
source: npm registry search, PyPI, and the 3GPP forge tooling page
summary: >-
  3GPP publishes no client libraries. It ships specifications and machine readable OpenAPI, and leaves
  implementation to vendors and operators. The registry search below found only third party work built around
  3GPP specifications, none of it first party.
official_packages: []
first_party_tooling:
  - name: API Parser / Linter
    url: https://forge.3gpp.org/swagger/tools/parser.html
    description: >-
      3GPP hosted browser tool that parses the published OpenAPI documents with the APIDevTools Swagger
      Parser and runs 3GPP lint rules over them.
  - name: Data Type Finder
    url: https://forge.3gpp.org/swagger/tools/types.html
    description: finds which APIs are impacted by a change to a given data type
  - name: API Versions Overview
    url: https://forge.3gpp.org/swagger/tools/versions.html
    description: report of the versions of every API in the repository
  - name: Custom header ABNF checker
    url: https://forge.3gpp.org/swagger/tools/headers.html?abnf=TS29500_CustomHeaders.abnf
    description: checks 3GPP HTTP custom headers against the TS 29.500 ABNF
third_party_packages:
