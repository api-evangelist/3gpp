- '3GPP publishes no AsyncAPI document. Its event surface is modelled inside the OpenAPI documents as OpenAPI 3.0
  callbacks: the consumer supplies a notification URI (notificationDestination, notifyUri or notificationRecipientAddress)
  when it creates a subscription, and the network function HTTP POSTs notifications back to that URI. That is a
  webhook contract expressed in OpenAPI rather than in AsyncAPI.'
