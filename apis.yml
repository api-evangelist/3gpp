aid: 3gpp
url: https://raw.githubusercontent.com/api-evangelist/3gpp/refs/heads/main/apis.yml
name: 3GPP
kind: company
description: '3GPP (the 3rd Generation Partnership Project) is the global standards partnership that writes
  the technical specifications for mobile networks — GSM, UMTS, LTE, 5G and the ongoing 6G work — through
  seven regional Organizational Partners (ARIB, ATIS, CCSA, ETSI, TSDSI, TTA and TTC) and a membership
  of operators, vendors and chipset makers. It is not a service provider and sells nothing to developers;
  it sits at the very top of the telecom value chain, defining the network functions that every mobile
  operator on earth deploys and that every CPaaS aggregator ultimately resells. Its API posture is unusually
  open for a standards body: all 3GPP specifications are published free of charge with no membership or
  login, and since Release 15 the RESTful Service-Based Architecture, the SCEF/NEF northbound exposure
  APIs and the SA5 management services have been published as machine-readable OpenAPI 3.0 YAML in a public
  GitLab instance at forge.3gpp.org. What 3GPP does not run is a developer programme — there is no portal,
  no key, no sandbox and no callable endpoint; the specifications describe interfaces that operators instantiate,
  and the developer-facing abstraction over them is CAMARA and GSMA Open Gateway, not 3GPP itself.'
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
