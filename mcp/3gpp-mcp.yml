summary: '3GPP publishes no MCP server, and could not host one: it specifies interfaces that mobile network
  operators instantiate, and every server entry in its OpenAPI documents is an {apiRoot} template rather
  than a callable host. What follows is a candidate tool surface derived from real operationIds in the
  specifications, so that an operator or exposure platform that deploys these interfaces has a ready made
  agent binding. Every tool below names the operationId it wraps; none of them are callable against 3GPP.'
server:
  name: 3gpp
  hosted: false
  transport: null
  url: null
  note: A deployment must supply apiRoot (and, for the SA5 management services, MnSRoot and MnSVersion)
    plus an OAuth2 client-credentials token endpoint before any of these tools can be bound to an endpoint.
authentication:
  type: oauth2
  flow: clientCredentials
  note: token issued by the NRF (TS 29.510) or the CAPIF core function (TS 29.222); see authentication/3gpp-authentication.yml
