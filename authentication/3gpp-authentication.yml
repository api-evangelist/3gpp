  on the CAPIF-1e and CAPIF-2e reference points; that is specified in prose and is not expressed as a mutualTLS
  securityScheme in the OpenAPI.
- 3GPP itself issues no credentials. The token endpoint, client id and secret all come from the operator or exposure
  platform that deployed the interface.
