  supplied {tokenUrl}; 64 of the documents declare it. There are no API keys, no basic auth and no openIdConnect
  scheme in the estate.
- Tokens are issued by the NRF (TS 29.510 Nnrf_AccessToken) for 5G core service based interfaces, and by the CAPIF
  core function (TS 29.222, security architecture in TS 33.122) for northbound APIs consumed by third party application
  functions.
